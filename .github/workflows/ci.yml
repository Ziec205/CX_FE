name: CI

on:
  push:
  pull_request:

jobs:
  web-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit -p apps/web && npx tsc --noEmit -p apps/admin
      - run: npm test -w @chamxanh/web
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # Sinh kiểu route (.expo/types) trước khi kiểm tra kiểu.
      - run: CI=1 timeout 90 npx expo start --offline || true
      - run: npx tsc --noEmit
      - run: npx eslint src
